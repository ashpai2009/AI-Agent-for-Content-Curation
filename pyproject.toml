[project]
name = "oatutor-council"
version = "0.1.0"
description = "Autonomous multi-agent curation of OATutor/OpenStax mathematics problem workbooks."
requires-python = ">=3.12"

# Every module the application imports directly is declared here. Nothing is
# relied upon as a transitive dependency of something else.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.18",  # FastAPI multipart upload parsing
  "pydantic>=2.9",
  "openpyxl>=3.1",
  "sympy>=1.13",
  "python-dotenv>=1.0",
  "python-docx>=1.1",
  "pypdf>=5.1",                # embedded-text extraction only - deliberately not a renderer

  # The provider is the Claude Code CLI, invoked as a subprocess. It is a *runtime*
  # dependency of the deployment rather than a Python package, which is why nothing here
  # names it: `pip install` cannot supply it and pretending otherwise would turn a clear
  # startup error into a confusing resolve failure. `require_credentials()` checks for the
  # executable and for a subscription login at boot.
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "reportlab>=4.2",            # authors text-based PDF fixtures
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The prompts are content the package cannot run without: every agent's system prompt is
# a file, and a wheel that omits them installs a service whose first model call raises.
[tool.setuptools.package-data]
oatutor_council = ["prompts/*.md", "prompts/_shared/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
